<!DOCTYPE html>

    <script>
        const swiper = new Swiper('.logo-swiper', {
            loop: true,
            allowTouchMove: false,
            autoplay: {
                delay: 0,
                disableOnInteraction: false,
            },
            speed: 5000,
            breakpoints: {
                320: {
                    slidesPerView: 2,
                    spaceBetween: 30
                },
                768: {
                    slidesPerView: 3,
                    spaceBetween: 40
