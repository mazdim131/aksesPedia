<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AksesPedia — Platform berita inklusif berbasis suara untuk semua kalangan.">
    <title>AksesPedia | Beranda</title>

    <!-- Favicon -->
    <link rel="icon" href="/src/assets/logo/logo.png">

    <!-- CSS: Global -->
    <link rel="stylesheet" href="/src/style/global.css">
    <!-- CSS: Komponen -->
    <link rel="stylesheet" href="/src/style/components/navbar.css">
    <link rel="stylesheet" href="/src/style/components/footer.css">
    <!-- CSS: Halaman Detail Berita -->
    <link rel="stylesheet" href="/src/style/page/detailBerita.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="container-sm p-0">
    <header>
        <navbar id="navbar"></navbar>
    </header>

    <div id="main">
        <main class="py-4">
            <div class="container detail-container" style="max-width: 1200px;">

                <!-- Banner Image -->
                <div class=" detail-banner">
                    <img id="detailImage" src="" alt="Banner Image">
                </div>

                <div class="detail-content-card">
                    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
                        <h4 class="mb-0 fw-bold">Kategori <span id="detailCategory"
                                class="text-danger fw-normal"></span></h4>
                        <div class="voice-assistant-toggle d-flex align-items-center">
                            <span class="me-2 small fw-semibold" id="voice-status">Bantuan Suara :
                                NonAktif</span>
                            <button class="btn btn-light rounded-circle voice-btn" id="voiceBtn"
                                aria-label="Aktifkan Suara">
                                <i class="bi bi-mic-fill" id="voiceIcon"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Title -->
                    <h1 id="detailTitle" class="detail-title fw-bold mb-4"></h1>

                    <!-- Author & Share -->
                    <div
                        class="d-flex justify-content-between align-items-center detail-meta position-relative flex-wrap gap-3">
                        <div class="d-flex align-items-center author-info">
                            <img id="detailAuthorImg" src="/src/assets/assetBeritaHero/fotoProfile/FotoBahlil.png"
                                alt="Author" class="author-img rounded-circle me-3">
                            <div>
                                <div class="author-name small">By <span id="detailAuthorName">Penulis</span>
                                </div>
                                <div class="author-date small" id="detailDate"></div>
                            </div>
                        </div>

                        <div class="share-container">
                            <button class="btn share-btn d-flex align-items-center" id="shareBtn">
                                <i class="bi bi-share me-2"></i> Bagikan
                            </button>
                            <!-- Share Dropdown -->
                            <div class="share-dropdown d-none" id="shareDropdown">
                                <div class="small mb-2">Bagikan Halaman Ini</div>
                                <div class="d-flex gap-3 mb-3">
                                    <a href="#" class="share-icon"><i class="bi bi-instagram"></i></a>
                                    <a href="#" class="share-icon"><i class="bi bi-facebook"></i></a>
                                    <a href="#" class="share-icon"><i class="bi bi-whatsapp"></i></a>
                                </div>
                                <div class="small mb-1">Bagikan Link Ini</div>
                                <div class="input-group input-group-sm">
                                    <input type="text" class="form-control copy-input bg-transparent border-secondary"
                                        value="" id="shareLink" readonly>
                                    <button class="btn copy-btn fw-semibold mx-3" id="copyBtn">Salin</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <hr class="detail-divider">

                    <!-- Article Body -->
                    <div id="detailDescription" class="detail-text text-white">
                        <!-- Konten berita disuntikkan dari JS -->
                    </div>
                </div>

            </div>

            <!-- Toast Konfirmasi Suara -->
            <div class="toast-container position-fixed top-0 end-0 p-3">
                <div id="voiceToast" class="toast" role="alert">
                    <div class="toast-header">
                        <i class="bi bi-volume-up-fill me-2"></i>
                        <strong class="me-auto">Bantuan Suara</strong>

                        <button type="button" class="btn-close" data-bs-dismiss="toast">
                        </button>
                    </div>

                    <div class="toast-body">
                        Aktifkan mode suara untuk membacakan berita?
                        <div class="mt-3 d-flex justify-content-end gap-2">
                            <button class="btn btn-sm" id="enableVoiceBtn">
                                <i class="bi bi-mic-fill"></i>
                            </button>

                            <button class="btn btn-sm" id="disableVoiceBtn" data-bs-dismiss="toast">
                                <i class="bi bi-mic-mute-fill"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer id="footer"></footer>

        <!-- JS: Data -->
        <script src="/src/data/beritaHero.js"></script>

        <!-- JS: Halaman Detail Berita -->
        <script src="/src/page/content/detailBerita.js"></script>
        <!-- JS: Komponen -->
        <script src="/src/page/components/navbar.js"></script>
        <script src="/src/page/components/footer.js"></script>

        <!-- JS keyboard Shortcut -->
        <script src="/src/js/modalSurvei.js"></script>
        <script src="/src/js/keyboardShortcut.js"></script>

        <!-- Bootstrap 5 JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
</body>

</html>
