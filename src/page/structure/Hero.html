<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AksesPedia — Platform berita inklusif berbasis suara untuk semua kalangan.">
    <title>AksesPedia | Beranda</title>

    <!-- Favicon -->
    <link rel="icon" href="/src/assets/logo/logo.png">

    <!-- CSS: Global -->
    <link rel="stylesheet" href="/src/style/global.css">
    <!-- CSS: Komponen -->
    <link rel="stylesheet" href="/src/style/components/navbar.css">
    <link rel="stylesheet" href="/src/style/components/footer.css">
    <!-- CSS: Halaman Hero -->
    <link rel="stylesheet" href="/src/style/Hero.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="container-sm p-0">
    <header>
        <navbar id="navbar"></navbar>
    </header>

        <div id="main">
            <section class="hero" id="hero-section"></section>

            <!-- Trending Section -->
            <section class="trending px-3">
                <h2 class="trending__heading h5 mb-3">Trending</h2>
                <div class="trending__list" id="trending-list">
                    <!-- Trending item disini -->
                </div>
            </section>

            <!-- Tagline Section -->
            <section class="tagline text-center py-5">
                <h1 class="tagline__title h2 mb-3 fw-bold" id="tagline-title">Ketika Suara Menjadi Jendela
                    Informasi</h1>
                <p class="tagline__subtitle text-muted mx-auto" style="max-width: 800px;" id="tagline-subtitle">
                    Platform artikel interaktif yang membebaskan mata Anda dari hambatan digital. Ketuk tombol
                    apapun, dan biarkan dunia bercerita kepada Anda.
                </p>
            </section>

            <!-- Berita Section -->
            <section class="berita py-4 px-3">
                <div class="row g-4">
                    <!-- Kolom Kiri: Jelajahi Berita Inklusif -->
                    <div class="col-lg-8 berita__kiri">
                        <div class="d-flex align-items-center mb-4">
                            <h3 class="h5 mb-0 fw-bold">Jelajahi Berita Inklusif Hari Ini</h3>
                            <div class="ms-3 flex-grow-1 border-bottom"></div>
                        </div>
                        <div id="berita-inklusif-content">
                            <!-- Isi dari berita inklusif -->
                        </div>
                    </div>

                    <!-- Kolom Kanan: Pilihan Redaksi -->
                    <div class="col-lg-4 berita__kanan">
                        <div class="d-flex align-items-center mb-4">
                            <h3 class="h5 mb-0 fw-bold">Pilihan Redaksi</h3>
                            <div class="ms-3 flex-grow-1 border-bottom"></div>
                        </div>
                        <div class="reaksi__list" id="pilihan-redaksi-list">
                            <!-- Isi dari pilihan redaksi -->
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- Footer -->
    <footer id="footer"></footer>

    <!-- JS: Data -->
    <script src="/src/data/beritaHero.js"></script>
    <!-- JS: Halaman Hero -->
    <script src="/src/page/content/Hero.js"></script>
    <!-- JS: Komponen -->
    <script src="/src/page/components/navbar.js"></script>
    <script src="/src/page/components/footer.js"></script>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
