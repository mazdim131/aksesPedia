<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AksesPedia — Platform berita inklusif berbasis suara untuk semua kalangan.">
    <title>AksesPedia | Beranda</title>

    <link rel="icon" href="/src/assets/logo/logo.png">

    <link rel="stylesheet" href="/src/style/global.css">
    <link rel="stylesheet" href="/src/style/components/navbar.css">
    <link rel="stylesheet" href="/src/style/components/footer.css">
    <link rel="stylesheet" href="/src/style/page/Hero.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="container-sm p-0">
    <header>
        <nav id="navbar" class="navbar navbar-expand-lg"></nav>
    </header>

    <main id="main">
        <section class="hero mb-5" id="hero-section"></section>

        <section class="trending mb-5">
            <h2 class="trending__heading h5 mb-3 fw-bold">Trending</h2>
            <div class="trending__list" id="trending-list"></div>
        </section>

        <section class="tagline text-center mb-5 py-4">
            <h1 class="tagline__title h2 mb-3 fw-bold" id="tagline-title">Ketika Suara Menjadi Jendela Informasi</h1>
            <p class="tagline__subtitle mx-auto text-muted" style="max-width: 800px;" id="tagline-subtitle">
                Platform artikel interaktif yang membebaskan mata Anda dari hambatan digital. Ketuk tombol apapun, dan
                biarkan dunia bercerita kepada Anda.
            </p>
        </section>

        <section class="berita mb-5">
            <div class="row g-4">
                <div class="col-lg-8 berita__kiri">
                    <div class="d-flex align-items-center mb-4">
                        <h3 class="h5 mb-0 fw-bold">Jelajahi Berita Inklusif Hari Ini</h3>
                        <div class="ms-3 flex-grow-1 border-bottom"></div>
                    </div>
                    <div id="berita-inklusif-content"></div>
                </div>

                <div class="col-lg-4 berita__kanan">
                    <div class="d-flex align-items-center mb-4">
                        <h3 class="h5 mb-0 fw-bold">Pilihan Redaksi</h3>
                        <div class="ms-3 flex-grow-1 border-bottom"></div>
                    </div>
                    <div class="reaksi__list" id="pilihan-redaksi-list"></div>
                </div>
            </div>
        </section>
    </main>

    <footer id="footer" class="py-4 mt-5"></footer>

    <script src="/src/data/beritaHero.js"></script>
    <script src="/src/page/content/Hero.js"></script>
    <script src="/src/page/content/Hero.js"></script>
    <script src="/src/page/components/navbar.js"></script>
    <script src="/src/page/components/footer.js"></script>
    <script src="/src/js/modalSurvei.js"></script>
    <script src="/src/js/keyboardShortcut.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
